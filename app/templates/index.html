<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DryGYE</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='leaflet.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <img class="logo" src="{{ url_for('static', filename='logo.png') }}" alt="">
    <h1><span class="dry">Dry</span><span class="gye">GYE</span></h1>
    <span class="tagline">Compare routes in Guayaquil during heavy rain</span>
  </header>
  <main>
    <section class="panel">
      <label class="field">
        <span>Conditions</span>
        <select id="conditions">
          <option value="forecast">Live forecast (Open-Meteo + INOCAR tide)</option>
          <option value="normal">Simulation · Normal</option>
          <option value="heavy_rain">Simulation · Heavy rain</option>
          <option value="heavy_rain_high_tide" selected>Simulation · Heavy rain + high tide</option>
        </select>
      </label>

      <div id="alert" class="alert">
        <strong id="level">Loading…</strong>
        <span id="alertDetail"></span>
      </div>

      <div class="forecast">
        <div class="section-title">Rain forecast · city center</div>
        <div class="totals">
          <span>Next 3 h<strong id="rain3h">—</strong></span>
          <span>Next 24 h<strong id="rain24h">—</strong></span>
        </div>
        <canvas id="rainChart" aria-label="Hourly rain forecast, next 24 hours"></canvas>
      </div>

      <div class="routes">
        <div class="section-title">Routes</div>
        <div class="segmented" role="group" aria-label="Point to place on the map">
          <button id="pickStart" type="button" class="active"><span class="pin-dot start">S</span>Start</button>
          <button id="pickEnd" type="button"><span class="pin-dot end">E</span>End</button>
        </div>
        <p id="routeHint" class="hint"></p>
        <button id="routeButton" type="button" disabled>Calculate routes</button>
        <div class="buttons">
          <button id="demoButton" type="button" class="ghost">Demo trip</button>
          <button id="clearButton" type="button" class="ghost">Clear</button>
        </div>
        <div id="routeResults"></div>
      </div>

      <label class="toggle"><input type="checkbox" id="floodToggle"> Show flood-prone zones</label>
      <p class="disclaimer">Relative risk estimated from terrain, rain and tide. Not an official warning.</p>
    </section>
    <section id="map" aria-label="Map of Guayaquil">
      <div id="simBanner" class="sim-banner" hidden>SIMULATION MODE</div>
    </section>
  </main>
  <script>const PILOT_BBOX = {{ pilot_bbox | tojson }}; // [south, west, north, east] from config.py</script>
  <script src="{{ url_for('static', filename='leaflet.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
